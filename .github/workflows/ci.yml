name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Lint summary
        if: always()
        run: echo "Markdown linting completed"

  link-checker:
    name: Link Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check links in markdown files
        run: |
          find . -name "*.md" -not -path "./node_modules/*" -exec markdown-link-check {} \;
        continue-on-error: true

      - name: Link check summary
        if: always()
        run: echo "Link validation completed"

  prompt-validation:
    name: Prompt Metadata Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate prompt metadata
        run: |
          echo "Validating prompt files..."

          # Check that all prompts have required frontmatter
          for file in prompts/*.md; do
            if [ -f "$file" ]; then
              echo "Checking $file..."

              # Check for Version field
              if ! grep -q "^**Version**:" "$file"; then
                echo "ERROR: $file missing Version field"
                exit 1
              fi

              # Check for Stacks Supported field
              if ! grep -q "^**Stacks Supported**:" "$file"; then
                echo "ERROR: $file missing Stacks Supported field"
                exit 1
              fi

              # Check for Project Types field
              if ! grep -q "^**Project Types**:" "$file"; then
                echo "ERROR: $file missing Project Types field"
                exit 1
              fi

              # Check for Author field
              if ! grep -q "^**Author**:" "$file"; then
                echo "ERROR: $file missing Author field"
                exit 1
              fi

              echo "✓ $file validation passed"
            fi
          done

          echo "All prompt metadata validation passed"

      - name: Prompt validation summary
        if: always()
        run: echo "Prompt metadata validation completed"

  file-structure:
    name: Repository Structure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required files exist
        run: |
          echo "Checking for required files..."

          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
            ".markdownlint.json"
            ".editorconfig"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file $file is missing"
              exit 1
            fi
            echo "✓ Found $file"
          done

          echo "All required files present"

      - name: Validate directory structure
        run: |
          echo "Checking for required directories..."

          required_dirs=(
            "prompts"
            "docs"
            "scripts"
            ".github/workflows"
            ".github/ISSUE_TEMPLATE"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required directory $dir is missing"
              exit 1
            fi
            echo "✓ Found $dir/"
          done

          echo "All required directories present"

      - name: Structure validation summary
        if: always()
        run: echo "Repository structure validation completed"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [markdown-lint, link-checker, prompt-validation, file-structure]

    steps:
      - name: Quality gate passed
        run: |
          echo "🎉 All quality checks passed!"
          echo "✓ Markdown linting"
          echo "✓ Link validation"
          echo "✓ Prompt metadata validation"
          echo "✓ Repository structure validation"
