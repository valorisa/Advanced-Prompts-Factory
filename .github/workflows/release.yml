name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract changelog section for this version
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

          # If no specific section found, use unreleased
          if [ ! -s release_notes.md ]; then
            sed -n "/## \[Unreleased\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          fi

          # Add header
          echo "# Advanced Prompts Factory $VERSION" > final_notes.md
          echo "" >> final_notes.md
          cat release_notes.md >> final_notes.md

          cat final_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: final_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "🎉 Release ${{ steps.version.outputs.version }} created successfully!"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"

  validate-release:
    name: Validate Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate prompts exist
        run: |
          echo "Validating prompt files are present..."

          if [ ! -d "prompts" ] || [ -z "$(ls -A prompts/*.md 2>/dev/null)" ]; then
            echo "ERROR: No prompt files found in prompts/ directory"
            exit 1
          fi

          echo "✓ Prompt files validated"

      - name: Validate documentation
        run: |
          echo "Validating documentation files..."

          docs=(
            "README.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "docs/architecture.md"
            "docs/prompts-index.md"
          )

          for doc in "${docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "ERROR: Documentation file $doc is missing"
              exit 1
            fi
            echo "✓ Found $doc"
          done

          echo "✓ All documentation validated"

      - name: Validation summary
        run: echo "✓ Release artifacts validated successfully"

  announce-release:
    name: Announce Release
    runs-on: ubuntu-latest
    needs: [create-release, validate-release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare announcement
        id: announcement
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Count prompts
          PROMPT_COUNT=$(ls -1 prompts/*.md 2>/dev/null | wc -l)
          echo "prompt_count=$PROMPT_COUNT" >> $GITHUB_OUTPUT

      - name: Announcement summary
        run: |
          echo "📢 Release Announcement"
          echo "Version: ${{ steps.announcement.outputs.version }}"
          echo "Prompts: ${{ steps.announcement.outputs.prompt_count }}"
          echo ""
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.announcement.outputs.version }}"
          echo ""
          echo "🎉 Advanced Prompts Factory ${{ steps.announcement.outputs.version }} is now available!"
